name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.14"
          cache: pip
          cache-dependency-path: requirements/paper-linux-cpu.txt
      - run: python -m pip install -r requirements/paper-linux-cpu.txt
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: python -m pytest
      - run: python -m ruff check src tests scripts examples
      - run: python -m ruff format --check src tests scripts examples
      - run: python -m mypy src/gatekg
      - run: python -m build
      - run: python scripts/check_distribution.py dist/gatekg-0.1.0-py3-none-any.whl
