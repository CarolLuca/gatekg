[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gatekg"
version = "0.1.0"
description = "A reproducible framework for gated knowledge-graph memory in language-model experiments."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*"]
authors = [{ name = "Carol-Luca Gasan" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "google-genai>=1.67,<2",
  "graphiti-core>=0.28,<0.29",
  "networkx>=3.3,<4",
  "nest-asyncio>=1.6,<2",
  "openai>=2.28,<3",
  "python-dotenv>=1.2,<2",
  "PyYAML>=6.0,<7",
  "requests>=2.32,<3",
  "rlms>=0.1.1,<0.2",
]

[project.optional-dependencies]
adaptive = ["torch>=2.3,<3"]
analysis = [
  "matplotlib>=3.9,<4",
  "pyshacl>=0.30,<0.32",
  "rdflib>=7.1,<8",
  "scikit-learn>=1.5,<2",
]
data = ["datasets>=4.0,<5"]
dev = [
  "build>=1.2,<2",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "types-PyYAML>=6,<7",
]
all = [
  "datasets>=4.0,<5",
  "matplotlib>=3.9,<4",
  "pyshacl>=0.30,<0.32",
  "rdflib>=7.1,<8",
  "scikit-learn>=1.5,<2",
  "torch>=2.3,<3",
]

[project.scripts]
gatekg = "gatekg.cli:main"
gatekg-build-dataset = "gatekg.training.build:main"
gatekg-train = "gatekg.training.train:main"
gatekg-label = "gatekg.training.label:main"
gatekg-advance = "gatekg.training.rounds:main"
gatekg-interpret = "gatekg.training.interpret:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["gatekg*"]

[tool.setuptools.package-data]
gatekg = ["default_config.yaml", "py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E402", "E501", "UP031", "SIM102", "SIM105", "SIM108", "SIM115", "SIM118"]

[tool.mypy]
python_version = "3.11"
packages = ["gatekg"]
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
follow_imports = "silent"
